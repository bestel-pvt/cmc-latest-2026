# =====================================================================
# nginx path-router for MediaMTX shards
# Phase 1: single shard (mediamtx:8888).
# Phase 2: multiple shards, mapped by channel slug prefix or a shard map
# emitted by the API. This file is generated/regenerated by the API for
# real deployments.
# =====================================================================

events { worker_connections 1024; }

http {
  # CORS for browser-side HLS.js clients
  map $http_origin $cors_origin { default '*'; }

  upstream mediamtx_shard_1 { server mediamtx:8888; }

  server {
    listen 8080;

    # Health
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # LL-HLS playback per channel path — /hls/<channel-slug>/index.m3u8
    location ~ ^/hls/(?<path>[^/]+)/(?<file>.*)$ {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods 'GET, OPTIONS'    always;
      add_header Access-Control-Allow-Headers 'Range, Content-Type' always;
      add_header Cache-Control 'no-store, no-cache, must-revalidate' always;

      if ($request_method = OPTIONS) { return 204; }

      # single-shard Phase 1 — route everything here
      proxy_pass http://mediamtx_shard_1/$path/$file;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
  }
}
