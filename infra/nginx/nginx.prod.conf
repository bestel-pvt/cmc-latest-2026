# =====================================================================
# nginx reverse proxy for the DEMP web + API.
# Sits between Cloudflare Tunnel (or a public LB) and the Next.js / Fastify
# processes running on the host under systemd.
#
# Also keeps the LL-HLS path routes for MediaMTX consumers on the LAN.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;
  client_max_body_size 50m;

  # WebSocket upgrade headers
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream demp_web { server 127.0.0.1:3001; keepalive 16; }
  upstream demp_api { server 127.0.0.1:4001; keepalive 16; }
  upstream demp_hls { server 127.0.0.1:8888; keepalive 8;  }

  server {
    listen 8080;
    server_name _;

    # WebSocket + REST for the API
    location /ws {
      proxy_pass http://demp_api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location /api/ {
      proxy_pass http://demp_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      # SSE streaming for /api/gpt/conversations/:id/message
      proxy_buffering off;
    }

    # LL-HLS playback for browser + LAN consumers
    location ~ ^/hls/(?<path>[^/]+)/(?<file>.*)$ {
      add_header Access-Control-Allow-Origin  '*' always;
      add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
      add_header Cache-Control 'no-store' always;
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass http://demp_hls/$path/$file;
    }

    # Everything else → Next.js
    location / {
      proxy_pass http://demp_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
