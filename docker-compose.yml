name: demp

services:
  postgres:
    image: postgres:16-alpine
    container_name: demp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: demp
      POSTGRES_PASSWORD: demp
      POSTGRES_DB: demp
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - demp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demp -d demp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: demp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - demp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mediamtx:
    # The -ffmpeg variant ships with the ffmpeg binary — required for the
    # runOnReady per-channel UDP re-broadcast hooks.
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: demp_mediamtx
    restart: unless-stopped
    # host networking is best for UDP MPEG-TS multicast, but on Windows/Mac
    # Docker Desktop uses port mappings instead. On the Linux server we'll
    # switch to network_mode: host in docker-compose.prod.yml.
    ports:
      # HLS
      - "8888:8888"
      # WebRTC (browser playback)
      - "8889:8889"
      # RTSP
      - "8554:8554"
      # RTMP (for republish)
      - "1935:1935"
      # SRT
      - "8890:8890/udp"
      # API (config + path management)
      - "9997:9997"
      # Prometheus metrics
      - "9998:9998"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings
    depends_on:
      postgres:
        condition: service_healthy

  # Local LLM runtime for DEMP GPT (no internet needed at runtime).
  # After first startup:
  #   docker exec demp_ollama ollama pull qwen2.5:3b-instruct
  # (once) then the model persists in demp_ollama_models volume.
  ollama:
    image: ollama/ollama:0.5.4
    container_name: demp_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - demp_ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 2

  # nginx as a path-router in front of (currently one, later N) MediaMTX shards
  nginx:
    image: nginx:1.27-alpine
    container_name: demp_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mediamtx

volumes:
  demp_pg_data:
  demp_redis_data:
  demp_ollama_models:
