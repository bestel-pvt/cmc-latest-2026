# =====================================================================
# nginx reverse proxy for the CMC web + API.
# Sits between Cloudflare Tunnel (or a public LB) and the Next.js / Fastify
# processes running on the host under systemd.
#
# CMC does NOT front any stream rebroadcast tier — the video-wall client
# joins UDP multicast directly on its LAN, and there is no server-side
# HLS / RTSP output.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;
  client_max_body_size 50m;

  # WebSocket upgrade headers
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream demp_web { server 127.0.0.1:3001; keepalive 16; }
  upstream demp_api { server 127.0.0.1:4001; keepalive 16; }

  server {
    listen 8080;
    server_name _;

    # WebSocket + REST for the API
    location /ws {
      proxy_pass http://demp_api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location /api/ {
      proxy_pass http://demp_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      # SSE streaming for /api/gpt/conversations/:id/message
      proxy_buffering off;
    }

    # Everything else → Next.js
    location / {
      proxy_pass http://demp_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
