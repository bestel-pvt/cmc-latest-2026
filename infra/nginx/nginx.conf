# =====================================================================
# nginx (local dev) — thin health-check listener.
#
# The stream-rebroadcast tier (MediaMTX + HLS/RTSP paths) was removed
# for CMC: the video-wall client joins UDP multicast directly on the
# viewer LAN, and recording reads UDP directly on the server. There is
# nothing for the browser to proxy for playback.
#
# nginx.prod.conf still fronts the web + API on 8080 in production.
# =====================================================================

events { worker_connections 1024; }

http {
  server {
    listen 8080;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  }
}
