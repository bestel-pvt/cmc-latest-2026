# =====================================================================
# nginx reverse proxy for the CMC web + API.
# Sits between Cloudflare Tunnel (or a public LB) and the Next.js / Fastify
# processes running on the host under systemd.
#
# `/hls/*` is also served here — the live-hls service writes m3u8
# playlists + .ts segments per active channel into $HLS_DIR (default
# `data/hls`), and this location just aliases that directory. Nothing
# is transcoded on the nginx side; MP2 → HLS remux happens in the
# ffmpeg supervisors under services/live-hls.
# =====================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;
  client_max_body_size 50m;

  # WebSocket upgrade headers
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream demp_web { server 127.0.0.1:3001; keepalive 16; }
  upstream demp_api { server 127.0.0.1:4001; keepalive 16; }

  server {
    listen 8080;
    server_name _;

    # Live HLS (per-channel playlists + .ts segments written by services/live-hls).
    # `alias` (NOT `root`) so the URL path prefix `/hls/` maps directly onto
    # the data directory without being appended to it. The `try_files` returns
    # a 404 immediately if a segment was already deleted from the sliding
    # window — hls.js handles this gracefully by advancing.
    location /hls/ {
      alias C:/CMC/data/hls/;
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
      }
      # LL-HLS-style: never cache m3u8 (playlist rewrites every segment),
      # short cache on .ts segments (immutable once written).
      location ~* \.m3u8$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Access-Control-Allow-Origin *;
      }
      location ~* \.ts$ {
        add_header Cache-Control "public, max-age=10";
        add_header Access-Control-Allow-Origin *;
      }
      try_files $uri =404;
    }

    # WebSocket + REST for the API
    location /ws {
      proxy_pass http://demp_api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
    location /api/ {
      proxy_pass http://demp_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      # SSE streaming for /api/gpt/conversations/:id/message
      proxy_buffering off;
    }

    # Everything else → Next.js
    location / {
      proxy_pass http://demp_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
